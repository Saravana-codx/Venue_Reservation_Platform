<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venue Management Portal</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f6f9; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { margin-bottom: 15px; color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 14px; }
        button { background-color: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 14px; }
        button:hover { background-color: #1d4ed8; }
        .alert { padding: 12px; border-radius: 5px; margin-top: 15px; display: none; font-size: 14px; font-weight: 500; }
        .alert-success { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .alert-error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; font-size: 14px; }
        th { background-color: #f8fafc; }
        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; background: #e2e8f0; }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. AUTHENTICATION SECTION -->
    <div class="card" id="authSection">
        <h2>1. Authentication (Login)</h2>
        <div class="grid">
            <div class="form-group">
                <label>Email / Username</label>
                <input type="text" id="loginEmail" placeholder="user@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••">
            </div>
        </div>
        <button onclick="login()">Login & Get JWT Token</button>
        <div id="authAlert" class="alert"></div>
    </div>

    <!-- 2. BOOKING SECTION -->
    <div class="card" id="bookingSection" style="opacity: 0.5; pointer-events: none;">
        <h2>2. Reserve a Hall</h2>
        <div class="grid">
            <div class="form-group">
                <label>Hall ID</label>
                <input type="number" id="hallId" value="1">
            </div>
            <div class="form-group">
                <label>Check-In Date</label>
                <input type="date" id="checkInDate">
            </div>
            <div class="form-group">
                <label>Check-Out Date</label>
                <input type="date" id="checkOutDate">
            </div>
        </div>
        <button onclick="createBooking()">Confirm Booking</button>
        <div id="bookingAlert" class="alert"></div>
    </div>

    <!-- 3. MY BOOKINGS LIST -->
    <div class="card" id="myBookingsSection" style="opacity: 0.5; pointer-events: none;">
        <h2>3. My Reservations</h2>
        <button onclick="loadMyBookings()">Refresh List</button>
        <table>
            <thead>
                <tr>
                    <th>Booking ID</th>
                    <th>Hall ID</th>
                    <th>Check-In</th>
                    <th>Check-Out</th>
                    <th>Total Price</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="bookingsTableBody">
                <tr><td colspan="6" style="text-align:center;">Log in to load bookings</td></tr>
            </tbody>
        </table>
    </div>

</div>

<script>
    const API_BASE = "http://localhost:8080/api";
    let jwtToken = "";

    // 1. LOGIN API CALL
    async function login() {
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;
    const alertBox = document.getElementById("authAlert");

    try {
        const res = await fetch(`${API_BASE}/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email, password: password })
        });

        const data = await res.json().catch(() => ({}));

        if (res.ok) {
            jwtToken = data.token || data.jwtToken || data.accessToken;
            showAlert(alertBox, "Login Successful! Token Saved.", "success");
            
            document.getElementById("bookingSection").style.opacity = "1";
            document.getElementById("bookingSection").style.pointerEvents = "auto";
            document.getElementById("myBookingsSection").style.opacity = "1";
            document.getElementById("myBookingsSection").style.pointerEvents = "auto";

            loadMyBookings();
        } else {
            showAlert(alertBox, data.message || `Login failed (Status: ${res.status})`, "error");
        }
    } catch (err) {
        console.error("Full fetch error:", err);
        showAlert(alertBox, "Could not connect to Spring Boot backend. Check Developer Tools (F12) console.", "error");
    }
}

    // 2. CREATE BOOKING API CALL
    async function createBooking() {
        const hallId = document.getElementById("hallId").value;
        const checkInDate = document.getElementById("checkInDate").value;
        const checkOutDate = document.getElementById("checkOutDate").value;
        const alertBox = document.getElementById("bookingAlert");

        if (!checkInDate || !checkOutDate) {
            showAlert(alertBox, "Please select both check-in and check-out dates.", "error");
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/bookings`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${jwtToken}`
                },
                body: JSON.stringify({
                    hallId: parseInt(hallId),
                    checkInDate: checkInDate,
                    checkOutDate: checkOutDate
                })
            });

            const data = await res.json();

            if (res.ok || res.status === 201) {
                showAlert(alertBox, `Booking Confirmed! Total Price: $${data.totalPrice}`, "success");
                loadMyBookings();
            } else {
                // Handles your JPQL double-booking Exception message!
                showAlert(alertBox, data.message || "Booking failed.", "error");
            }
        } catch (err) {
            showAlert(alertBox, "Network error while attempting booking.", "error");
        }
    }

    // 3. GET MY BOOKINGS API CALL
    async function loadMyBookings() {
        const tableBody = document.getElementById("bookingsTableBody");

        try {
            const res = await fetch(`${API_BASE}/bookings/my-bookings`, {
                method: "GET",
                headers: { "Authorization": `Bearer ${jwtToken}` }
            });

            if (res.ok) {
                const bookings = await res.json();
                tableBody.innerHTML = "";

                if (bookings.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No bookings found.</td></tr>`;
                    return;
                }

                bookings.forEach(b => {
                    tableBody.innerHTML += `
                        <tr>
                            <td>#${b.id}</td>
                            <td>Hall ${b.hallId}</td>
                            <td>${b.checkInDate}</td>
                            <td>${b.checkOutDate}</td>
                            <td>$${b.totalPrice}</td>
                            <td><span class="status-badge">${b.bookingStatus || 'CONFIRMED'}</span></td>
                        </tr>
                    `;
                });
            }
        } catch (err) {
            console.error("Failed to load bookings", err);
        }
    }

    // Helper method to display clean alert messages
    function showAlert(element, message, type) {
        element.style.display = "block";
        element.className = `alert alert-${type}`;
        element.innerText = message;
    }
</script>

</body>
</html>
